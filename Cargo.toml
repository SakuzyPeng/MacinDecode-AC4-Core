[workspace]
resolver = "3"
members = [
    "crates/macindecode-ac4-bitstream",
    "crates/macindecode-ac4-scene",
    "crates/macindecode-ac4-mp4",
    "crates/macindecode-ac4-cli",
    "crates/macindecode-ac4-perf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core"

[workspace.dependencies]
macindecode-ac4-bitstream = { version = "0.1.0", path = "crates/macindecode-ac4-bitstream" }
macindecode-ac4-mp4 = { version = "0.1.0", path = "crates/macindecode-ac4-mp4" }
macindecode-ac4-scene = { version = "0.1.0", path = "crates/macindecode-ac4-scene" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
