name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/experiments/**"
      # check_transform_tables.py 直接读取该 ADR，不能按纯文档跳过。
      - "docs/decisions/0003-trigonometric-tables-for-the-transform.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  MACINDECODE_AC4_SPEC_DIR: ${{ github.workspace }}/spec

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          target: thumbv7em-none-eabi
          python-dependencies: scripts/requirements-pcm.txt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Scene no_std API
        run: cargo check --locked -p macindecode-ac4-scene --lib --target thumbv7em-none-eabi --no-default-features

      - name: Check metadata no_std API without tables
        run: cargo check --locked -p macindecode-ac4-metadata --lib --target thumbv7em-none-eabi --no-default-features

      - name: Lint default features
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test default features
        run: cargo test --locked --workspace

      - name: Verify crates.io packages
        run: |
          for crate_license in crates/*/LICENSE; do
            cmp LICENSE "$crate_license"
          done
          cargo package --locked --workspace

      - name: Audit specification distribution boundary
        run: python3 scripts/check_spec_distribution.py

      - name: Audit transform tables
        run: python3 scripts/check_transform_tables.py

      - name: Audit real function anchors
        run: python3 scripts/check_math.py

      - name: Audit HF patch tables
        run: python3 scripts/check_patch_tables.py --sweep

      - name: Audit syntax/decode layer direction
        run: python3 scripts/check_layers.py

      - name: Test CI gates and PDF page selection
        run: python3 -m unittest scripts/test_ci_support.py scripts/test_pdf_tables.py

      - name: Test layer dependency checker
        run: python3 -m unittest scripts/test_check_layers.py

      - name: Test HF patch table checker
        run: python3 -m unittest scripts/test_check_patch_tables.py

      - name: Test trajectory checker
        run: python3 -m unittest scripts/test_trajectory_check.py

      - name: Test decode baseline checker
        run: python3 -m unittest scripts/test_decode_check.py

      - name: Test external object PCM comparison without proprietary media
        run: |
          python3 -m pip install -r scripts/requirements-pcm.txt
          python3 -m unittest scripts/test_compare_object_pcm.py scripts/test_check_aspx_gain_replay.py scripts/test_check_aspx_noise_replay.py scripts/test_check_aspx_tone_replay.py scripts/test_check_aspx_basis_replay.py scripts/test_check_qmf_analysis_checkpoints.py scripts/test_check_asf_imdct_checkpoints.py scripts/test_check_qmf_width.py scripts/test_check_aspx_hf_replay.py scripts/test_check_aspx_downstream_replay.py scripts/test_check_aspx_noise_mask.py scripts/test_check_aspx_preflatten_direction.py scripts/test_check_qmf_phase_chain.py
          python3 scripts/check_aspx_math.py

      - name: Test A-JOC census checker
        run: python3 -m unittest scripts/test_ajoc_census.py

      - name: Test EMDF census checker
        run: python3 -m unittest scripts/test_emdf_census.py

      - name: Test DEE IMS job configuration
        run: python3 -m unittest scripts/test_dee_ims.py

      - name: Test DME A-JOC job configuration
        run: python3 -m unittest scripts/test_dme_ac4.py

      - name: Test DME native job configuration
        run: python3 -m unittest scripts/test_dme_native.py

      - name: Test DAMF headphone timeline checker
        run: python3 -m unittest scripts/test_check_damf_headphone.py

  audio_checks:
    name: audio checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up audio build
        uses: ./.github/actions/setup-build
        with:
          target: thumbv7em-none-eabi
          spec-tables: "true"

      - name: Check Scene no_std decoder
        run: cargo check --locked -p macindecode-ac4-scene --lib --target thumbv7em-none-eabi --no-default-features --features audio-decode

      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --features audio-decode

      # `spec-tables` 是 `audio-decode` 之外的第三个配置：A-SPX/ASF/A-JOC 的推导层需要
      # 本地生成的 PDF 表，但不需要规范随附的 Huffman 码本。只有 decode 声明该 feature，
      # 因此按包而非按 workspace 检查。没有这一步，推导层与解码层之间的 seam 无人验证。
      - name: Lint spec-tables feature
        run: cargo clippy --locked -p macindecode-ac4-decode --all-targets --features spec-tables -- -D warnings

      - name: Test spec-tables feature
        run: cargo test --locked -p macindecode-ac4-decode --features spec-tables

      - name: Lint audio-decode feature
        run: cargo clippy --locked --workspace --all-targets --features audio-decode -- -D warnings

      - name: Check independent metadata backend
        run: |
          cargo check --locked -p macindecode-ac4-metadata --lib --target thumbv7em-none-eabi --no-default-features --features metadata-decode
          cargo clippy --locked --workspace --all-targets --features metadata-decode -- -D warnings
          cargo test --locked -p macindecode-ac4-decode -p macindecode-ac4-metadata -p macindecode-ac4-inspect --features metadata-decode

      - name: Test audio-decode feature
        run: cargo test --locked --workspace --features audio-decode

      - name: Verify crates.io packages with audio-decode
        run: cargo package --locked --workspace --all-features

  spec_audit:
    name: specification audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          spec-tables: "true"
          cargo-cache: "false"
      - name: Compare fast and full PDF extraction
        run: python scripts/generate_spec_tables.py --check-full-scan
      - name: Audit generated tables
        run: |
          python scripts/check_sfb_tables.py
          python scripts/check_aspx_tables.py
          python scripts/check_ajoc_tables.py
          python scripts/check_spec_distribution.py --generated

  consistency:
    name: consistency (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}
          spec-tables: "true"
      - name: Check frozen PCM and CLI contracts
        run: python scripts/ci_support.py consistency --target ${{ matrix.target }}

  audio_decode:
    name: audio-decode
    if: always()
    needs: [audio_checks, spec_audit, consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every audio check to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_support.py gate audio_checks spec_audit consistency

  msrv:
    name: msrv
    if: always()
    needs: [quality, audio_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require complete tests on the pinned MSRV
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci_support.py gate quality audio_checks
          python3 scripts/ci_support.py toolchain
