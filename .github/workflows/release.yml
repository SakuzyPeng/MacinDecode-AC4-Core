name: Release binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/**"
      - ".gitignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain*"
      - "scripts/**"
      - "spec/MANIFEST.json"
      - "README.md"
      - "README.en.md"
      - "LICENSE"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
  PYTHONUTF8: "1"

jobs:
  prepare:
    name: release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "tag $REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          tool_dir="$RUNNER_TEMP/cargo-audit"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'schedule'
    needs:
      - prepare
      - audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: macinac4
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: macinac4
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: macinac4
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: macinac4
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: macinac4.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: macinac4.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up native Python
        if: matrix.target != 'aarch64-pc-windows-msvc'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-spec.txt

      - name: Set up x64 Python on Windows ARM
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-spec.txt

      - name: Install stable Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Generate local specification tables
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-spec.txt
          python scripts/fetch_specs.py
          python scripts/generate_spec_tables.py
          python scripts/check_spec_distribution.py --generated

      - name: Build full release binary
        env:
          MACINDECODE_AC4_SPEC_DIR: ${{ github.workspace }}/spec
        run: cargo +stable build --locked --release -p macindecode-ac4-cli --bin macinac4 --features audio-decode --target ${{ matrix.target }}

      - name: Smoke test release binary
        if: runner.os != 'Windows'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --version

      - name: Smoke test release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target/${{ matrix.target }}/release/${{ matrix.executable }}" --version'

      - name: Package release binary
        run: >-
          python scripts/package_release.py
          --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
          --target ${{ matrix.target }}
          --version ${{ needs.prepare.outputs.version }}
          --commit ${{ github.sha }}
          --output-dir dist

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: all platforms
    if: github.event_name != 'schedule'
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify and index packages
        shell: bash
        working-directory: dist
        run: |
          sha256sum --check --strict -- ./*.sha256
          sha256sum -- ./*.tar.gz ./*.zip | sort --key=2 > SHA256SUMS

      - name: Upload complete release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macinac4-v${{ needs.prepare.outputs.version }}-all-platforms
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - prepare
      - bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download complete release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macinac4-v${{ needs.prepare.outputs.version }}-all-platforms
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "MacinDecode AC-4 Core $RELEASE_TAG")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
