[package]
name = "macindecode-ac4-cli"
description = "Inspection, trace, and ADM/DAMF scene export tooling for AC-4 bitstreams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/macindecode-ac4-cli"
readme = "README.md"
keywords = ["ac-4", "audio", "mp4", "adm", "damf"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "tests/**", "schema/**", "README.md", "LICENSE"]

[[bin]]
name = "macinac4"
path = "src/main.rs"

[features]
default = []
# 解析 A-JOC substream 的音频数据。转发到 bitstream crate 的同名 feature，
# 关闭时 trace 的 `ajoc_audio` 字段为 null，其余输出不变。
audio-decode = [
    "macindecode-ac4-bitstream/audio-decode",
    "dep:macindecode-ac4-scene",
    "macindecode-ac4-scene/audio-decode",
    "dep:renamore",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
macindecode-ac4-bitstream.workspace = true
macindecode-ac4-mp4.workspace = true
macindecode-ac4-scene = { workspace = true, optional = true }
quick-xml = { version = "0.41", default-features = false }
renamore = { version = "0.3.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
