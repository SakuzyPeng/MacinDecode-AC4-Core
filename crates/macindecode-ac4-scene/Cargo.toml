[package]
name = "macindecode-ac4-scene"
description = "Streaming render-ready scene views for AC-4 Core and Full A-JOC decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/macindecode-ac4-scene"
readme = "README.md"
keywords = ["ac-4", "audio", "object-audio", "decoder", "no-std"]
categories = ["multimedia::audio", "no-std"]
include = ["src/**", "README.md", "LICENSE"]

[features]
default = []
audio-decode = ["dep:macindecode-ac4-decode", "macindecode-ac4-decode/audio-decode"]

[dependencies]
macindecode-ac4-bitstream.workspace = true
macindecode-ac4-decode = { workspace = true, optional = true }

[lints]
workspace = true
