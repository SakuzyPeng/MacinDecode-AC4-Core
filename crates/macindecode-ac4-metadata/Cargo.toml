[package]
name = "macindecode-ac4-metadata"
description = "Streaming AC-4 metadata observation without PCM reconstruction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ac-4", "audio", "metadata", "no-std"]
categories = ["multimedia::audio", "no-std"]
include = ["src/**", "README.md", "LICENSE"]

[features]
default = []
metadata-decode = ["dep:macindecode-ac4-decode", "macindecode-ac4-decode/metadata-decode"]

[dependencies]
macindecode-ac4-bitstream.workspace = true
macindecode-ac4-decode = { workspace = true, optional = true }

[lints]
workspace = true
