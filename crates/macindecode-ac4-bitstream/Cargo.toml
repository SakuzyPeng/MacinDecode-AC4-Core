[package]
name = "macindecode-ac4-bitstream"
description = "no_std AC-4 bitstream parsing, metadata, and audio reconstruction primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/macindecode-ac4-bitstream"
readme = "README.md"
keywords = ["ac-4", "audio", "bitstream", "decoder", "no-std"]
categories = ["multimedia::audio", "parser-implementations", "no-std"]
include = ["src/**", "build.rs", "build_support/**", "README.md", "LICENSE"]

[features]
default = []
# 从用户本地的官方 ETSI PDF 生成并消费静态表。表值不随仓库或 crate 分发；
# 运行 `scripts/fetch_specs.py` 与 `scripts/generate_spec_tables.py` 后启用。
spec-tables = []
# 音频解码路径：Huffman 码本、QMF 原型窗，以及依赖它们的 ASF/A-SPX/A-JOC 处理。
#
# 默认关闭的原因不是这些代码可选，而是它们需要规范随附的 C 表——那些文件受
# 版权保护，不随仓库或 crate 包分发。仓库构建先运行 `scripts/fetch_specs.py`；
# 注册表构建通过 `MACINDECODE_AC4_SPEC_DIR` 指向已准备好的表目录。
#
# 关闭时仍可完整解析容器、TOC、OAMD 与 metadata。
audio-decode = ["spec-tables"]
# 仅供内部 macOS `sample` 归因：阻止 QMF 合成三个阶段互相内联，以保留独立符号。
# 不应与正式 timing/allocation 数据混用。
qmf-split-profile = ["audio-decode"]
# 仅供内部 macOS `sample` 归因：阻止 A-JOC 重建阶段互相内联，以保留独立符号。
# 不应与正式 timing/allocation 数据混用。
ajoc-reconstruction-split-profile = ["audio-decode"]

[build-dependencies]
libm = { version = "=0.2.16", default-features = false }

[lints]
workspace = true
